# Which file types are indexed, and what reads them.
#
# **This file is the packaged default and is tracked in git. Never edited at
# runtime.** Your machine's overrides live in `<DATA_PATH>\extractors.toml`,
# which is not tracked, is written by Settings, and is merged over the top of
# this one. So an upgrade brings new defaults without discarding your choices,
# and deleting your file restores the shipped behaviour exactly.
#
# ---------------------------------------------------------------------------
# The three tiers, and why the boundary is where it is
# ---------------------------------------------------------------------------
#
#   1. Config only     routing and policy - which extensions are on, which
#                      registered extractor handles them, size caps.
#   2. Converter       an external command turns the file into something an
#                      existing extractor already reads. Unlimited formats,
#                      no new Python.
#   3. Code            anything needing real parsing: PDF, PST, OCR, ODF.
#
# **Config stops at tier 2, deliberately.** A configuration format that can
# express arbitrary parsing is a programming language with no debugger, no type
# checker and no tests - strictly worse than the Python it replaced.
#
# ---------------------------------------------------------------------------

schema_version = 1

[defaults]
# Files larger than this are skipped. Per-format overrides below; OCR and
# converters get much smaller caps because their cost is per-byte and high.
max_bytes = 104857600            # 100MB
enabled = true


# ---------------------------------------------------------------------------
# Tier 1 - extension -> a registered extractor, by name
#
# Only extensions that need to differ from the extractor's own defaults need an
# entry. Everything an extractor already claims in code keeps working untouched.
#
# **No content deny-lists.** Leasha reads exactly what the login can read, by the
# owner's design decision (2026-08-28). There is no format skip-list, no header
# sniffs to guess content sensitivity, and no automatic skipping based on file type.
# It is a lens, not a censor. Sensitivity enforcement belongs to the generating
# system (encryption, file ACLs); Leasha's index is treated as sensitive data by
# whoever owns the machine. If a file should not be indexed, it should not be
# readable by the login that is indexing.
# ---------------------------------------------------------------------------

[extensions]

# Every extractor named below now exists, and every route here is on. A route
# may still be switched off deliberately - `enabled = false` - and a disabled
# one is not validated against the registry, so a format can be routed here
# before the code that reads it ships. The check runs the moment the line is
# enabled, which is when the answer starts to matter.

# --- OpenDocument, read natively (zipfile + ElementTree, no dependency) ------
".odt" = { extractor = "odf" }
".ods" = { extractor = "odf" }
".odp" = { extractor = "odf" }
".ott" = { extractor = "odf" }
".ots" = { extractor = "odf" }
".otp" = { extractor = "odf" }

# --- Google Workspace pointers ----------------------------------------------
# These hold no document content - only a URL and an id. Indexed so the pointer
# is findable, and flagged so "I searched for text I know is in that doc" has an
# answer. See app/extract/cloudstub.py.
".gdoc"    = { extractor = "cloudstub" }
".gsheet"  = { extractor = "cloudstub" }
".gslides" = { extractor = "cloudstub" }
".gdraw"   = { extractor = "cloudstub" }
".gform"   = { extractor = "cloudstub" }
".gjam"    = { extractor = "cloudstub" }
".gsite"   = { extractor = "cloudstub" }

# --- Images, read by OCR ----------------------------------------------------
# ON BY DEFAULT, by the project owner's explicit choice, made knowing that on a
# corpus with many images this can dominate an entire index run.
#
# **Measured**: about 3.6 seconds for a full page of text, which is roughly eight
# times what embedding one passage costs. Ten thousand scanned pages is ten
# hours. Each document records `ocr_seconds`, so the cost is attributable rather
# than mysterious.
#
# 25MB cap: OCR cost scales with pixels, so a larger image is minutes of work for
# a scan nobody will read.
#
# To switch it off, set `enabled = false` on these lines in your own
# `<DATA_PATH>\extractors.toml` - the packaged file is replaced on upgrade.
".png"  = { extractor = "ocr", max_bytes = 26214400 }
".jpg"  = { extractor = "ocr", max_bytes = 26214400 }
".jpeg" = { extractor = "ocr", max_bytes = 26214400 }
".tif"  = { extractor = "ocr", max_bytes = 26214400 }
".tiff" = { extractor = "ocr", max_bytes = 26214400 }
".bmp"  = { extractor = "ocr", max_bytes = 26214400 }
".webp" = { extractor = "ocr", max_bytes = 26214400 }
".gif"  = { extractor = "ocr", max_bytes = 26214400 }
".heic" = { extractor = "ocr", max_bytes = 26214400 }
".heif" = { extractor = "ocr", max_bytes = 26214400 }
".svg"  = { extractor = "ocr", max_bytes = 26214400 }

# RAW camera formats: extract the embedded JPEG preview via rawpy, then OCR that.
# Never decode the full RAW — it adds no text value and wastes time. If rawpy is
# not installed, these fall back to indexing by filename only.
".cr2"  = { extractor = "raw", max_bytes = 104857600 }
".nef"  = { extractor = "raw", max_bytes = 104857600 }
".dng"  = { extractor = "raw", max_bytes = 104857600 }
".arw"  = { extractor = "raw", max_bytes = 104857600 }

# --- AutoCAD ----------------------------------------------------------------
# `.dxf` is read natively by app/extract/cad.py (notes, title-block attributes,
# layer and block names). `.dwg` is NOT listed here on purpose: it is handled by
# the converter below, and an extension claimed by an extractor never reaches a
# converter at all. 20MB cap - a drawing larger than that is geometry, and its
# text is not proportionally richer for the time spent parsing it.
".dxf" = { extractor = "cad", max_bytes = 20971520 }

# --- Text-ish files that are plain text by any other name -------------------
".conf"       = { extractor = "plaintext" }
".env"        = { extractor = "plaintext" }
".properties" = { extractor = "plaintext" }
".tex"        = { extractor = "plaintext" }
".bib"        = { extractor = "plaintext" }
".adoc"       = { extractor = "plaintext" }
".org"        = { extractor = "plaintext" }
".srt"        = { extractor = "plaintext" }
".vtt"        = { extractor = "plaintext" }
".ics"        = { extractor = "plaintext" }
".vcf"        = { extractor = "plaintext" }
".jsonl"      = { extractor = "plaintext" }
".ndjson"     = { extractor = "plaintext" }

# --- Web templates and .NET ---------------------------------------------------
# Server-side pages are text with markup around it, and the text is the part
# somebody searches for. A repository of ASP.NET work is mostly these: the .cs
# files were already read and the .aspx beside them - the markup, the labels,
# the inline script - were not, so half of each page was missing from the index
# with nothing to say so.
".aspx"       = { extractor = "plaintext" }
".ascx"       = { extractor = "plaintext" }
".asmx"       = { extractor = "plaintext" }
".ashx"       = { extractor = "plaintext" }
".asax"       = { extractor = "plaintext" }
".master"     = { extractor = "plaintext" }
".asp"        = { extractor = "plaintext" }
".cshtml"     = { extractor = "plaintext" }
".vbhtml"     = { extractor = "plaintext" }
".razor"      = { extractor = "plaintext" }
".jsp"        = { extractor = "plaintext" }
".php"        = { extractor = "plaintext" }
".erb"        = { extractor = "plaintext" }
".hbs"        = { extractor = "plaintext" }
".vue"        = { extractor = "plaintext" }
".svelte"     = { extractor = "plaintext" }
".jsx"        = { extractor = "plaintext" }
".tsx"        = { extractor = "plaintext" }

# Project and configuration files. XML, and the place connection strings, app
# settings and build steps live - which is exactly what somebody greps a repo
# for months later.
".config"     = { extractor = "plaintext" }
".resx"       = { extractor = "plaintext" }
".csproj"     = { extractor = "plaintext" }
".vbproj"     = { extractor = "plaintext" }
".sln"        = { extractor = "plaintext" }

# --- Code -------------------------------------------------------------------
".kt"         = { extractor = "plaintext" }
".swift"      = { extractor = "plaintext" }
".scala"      = { extractor = "plaintext" }
".r"          = { extractor = "plaintext" }
".m"          = { extractor = "plaintext" }
".pl"         = { extractor = "plaintext" }
".lua"        = { extractor = "plaintext" }
".dart"       = { extractor = "plaintext" }
".vb"         = { extractor = "plaintext" }
".asm"        = { extractor = "plaintext" }
".make"       = { extractor = "plaintext" }
".dockerfile" = { extractor = "plaintext" }
".gradle"     = { extractor = "plaintext" }
".tf"         = { extractor = "plaintext" }


# ---------------------------------------------------------------------------
# Tier 2 - external converters
#
# `{input}`, `{outdir}` and `{stem}` are substituted. `produces` names the file
# the command is expected to leave in `{outdir}`; `then` is the registered
# extractor that reads it.
#
# **Every converter ships enabled**, on the owner's instruction: *"all formats
# should be on by default."*
#
# They shipped disabled on the reasoning that a format silently failing on
# every file is worse than one that says it is off. That reasoning was right
# about the failure mode and wrong about the remedy: a route that is off is
# indistinguishable from a format nobody thought of, and somebody with
# LibreOffice installed had to find a setting they did not know existed to
# index their own `.doc` files.
#
# On is the better default because the failure is **not** silent.
# `ERR_CONVERTER_MISSING` names the binary, says the file is indexed by name
# only until it is installed, and carries the install command - so an absent
# converter reports itself once per file type rather than never.
#
# `doctor.py` still reports which binaries were found.
#
# The executable must be on the allow-list in `app/extract/converter.py`, which
# lives in code and not here - a config file that can name any executable is a
# way to run anything.
# ---------------------------------------------------------------------------

[converters]

[converters.".doc"]
command   = ["soffice", "--headless", "--convert-to", "txt:Text", "--outdir", "{outdir}", "{input}"]
produces  = "{stem}.txt"
then      = "plaintext"
timeout_s = 180
enabled   = true

# 2026-09-19: was `txt:Text` -> plaintext, copied from `.doc`. `txt:Text` is a
# Writer export filter; Impress has none, so LibreOffice exited 1 and wrote
# nothing for EVERY presentation - 79 of 79 `.ppt` files in the owner's index
# were skipped ERR_CONVERTER_FAILED, each after 4-19 seconds of LibreOffice
# start-up. A presentation is converted to the format the `pptx` reader
# already handles instead.
[converters.".ppt"]
command   = ["soffice", "--headless", "--convert-to", "pptx", "--outdir", "{outdir}", "{input}"]
produces  = "{stem}.pptx"
then      = "pptx"
timeout_s = 180
enabled   = true

[converters.".pages"]
command   = ["soffice", "--headless", "--convert-to", "txt:Text", "--outdir", "{outdir}", "{input}"]
produces  = "{stem}.txt"
then      = "plaintext"
timeout_s = 180
enabled   = true

[converters.".numbers"]
command   = ["soffice", "--headless", "--convert-to", "csv", "--outdir", "{outdir}", "{input}"]
produces  = "{stem}.csv"
then      = "plaintext"
timeout_s = 180
enabled   = true

# 2026-09-20: read in-process first by app/extract/iwork.py (a few ms, no
# LibreOffice); this route is only the fallback for what that reader declines
# (an iWork '09 package, an encrypted file). It was `txt:Text` -> plaintext, which
# is a Writer filter: Impress has none, LibreOffice exited 1 and wrote nothing for
# all 8 of 8 `.key` files measured (27 on the owner's disk) - the `.ppt` fault
# again. Converted to pptx and read by the `pptx` reader instead, verified on the
# same 8 files.
[converters.".key"]
command   = ["soffice", "--headless", "--convert-to", "pptx", "--outdir", "{outdir}", "{input}"]
produces  = "{stem}.pptx"
then      = "pptx"
timeout_s = 180
enabled   = true

# Conversion quality for these two is poor even when it works. Shipped off, with
# an honest status rather than a promise the output will not keep.
[converters.".wpd"]
command   = ["soffice", "--headless", "--convert-to", "txt:Text", "--outdir", "{outdir}", "{input}"]
produces  = "{stem}.txt"
then      = "plaintext"
timeout_s = 120
enabled   = true
note      = "WordPerfect conversion is unreliable; expect missing formatting and some lost text."

# 2026-09-20: read in-process first by app/extract/publisher.py (Quill text
# chunk, ~4 ms). This is the fallback only. It was `txt:Text` -> plaintext: a
# Writer filter, but Publisher opens in Draw, so 8 of 8 measured `.pub` files
# converted to nothing. Now exported as a PDF and read by the `pdf` reader, which
# is what the in-process reader was proven against (8 of 8 written).
[converters.".pub"]
command   = ["soffice", "--headless", "--convert-to", "pdf", "--outdir", "{outdir}", "{input}"]
produces  = "{stem}.pdf"
then      = "pdf"
timeout_s = 120
enabled   = true
note      = "Publisher conversion is unreliable; layout-heavy files often yield little text."

# AutoCAD DWG: proprietary binary, no open specification, and no Python library
# reads it - ezdxf explicitly does not. Converting to DXF is the only honest
# route, and then app/extract/cad.py reads the result properly.
#
# `dwg2dxf` comes with LibreDWG (free): https://www.gnu.org/software/libredwg/
# The Open Design Alliance's ODAFileConverter is the other allowed option, but
# it converts whole directories rather than single files and does not fit the
# {input}/{outdir} contract, so it needs a wrapper - dwg2dxf is the one to use.
#
# Without either, .dwg files are still found by name; only their contents are
# missing. 20MB cap matches .dxf, applied before the conversion is attempted.
[converters.".dwg"]
command   = ["dwg2dxf", "-o", "{outdir}/{stem}.dxf", "{input}"]
produces  = "{stem}.dxf"
then      = "cad"
timeout_s = 180
enabled   = true
note      = "Needs LibreDWG's dwg2dxf on PATH. DWG has no open specification, so conversion quality varies by the AutoCAD version that wrote the file."

# `.epub`, `.fb2`, `.rtf` and `.xls` used to be here, routed to pandoc and
# soffice. They are now read in-process by app/extract/ebook.py, rtf.py and
# xls.py - a zip of XHTML, a single XML document, a text markup format and an
# OLE2 workbook, none of which needed a subprocess. See non-negotiable 12 and
# docs/WORKORDER-libraries-before-converters.md.
#
# That removed pandoc from the project entirely, and left LibreOffice needed
# only for the formats below, which genuinely have no library.
