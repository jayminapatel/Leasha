# Tooling configuration. Not a packaging manifest: the app is run from the
# project folder, not pip-installed.

[tool.pytest.ini_options]
# pytest-qt's binding, named: the trial venv can see PyQt6 too.
qt_api = "pyside6"
minversion = "8.0"
testpaths = ["tests"]
# pytest still walks the rootdir looking for conftest files, and basetemp lives
# there - so without this it tries to collect its own scratch directory, and on
# Windows fails on the permissions of a folder it created itself.
norecursedirs = [".pytest_tmp", ".git", "venv", "logs", "build", "dist", "__pycache__"]
# Makes `import app` work regardless of where pytest is invoked from, so the
# VS Code Test Explorer and a bare `pytest` behave identically.
pythonpath = ["."]
# pytest's temporary files live inside the project instead of
# %LOCALAPPDATA%\Temp. Not tidiness - a correctness fix.
#
# 2026-10-10: the basetemp is no longer a fixed `--basetemp=.pytest_tmp` here.
# pytest deletes a given basetemp when a run starts, so two runs in one checkout
# at once wiped each other's temporary folders. `tests/conftest.py`
# (`pytest_configure`, helper in `tests/basetemp.py`) now gives every run that
# was not handed an explicit `--basetemp` its own `.pytest_tmp/run-<pid>` - still
# a dedicated folder inside the project, so everything below still holds - and
# removes it after a green run. An explicit `--basetemp` still wins.
#
# pytest maintains a `pytest-current` junction in its temp root pointing at the
# newest run. On Windows, creating and resolving a junction needs a privilege
# that a normal account may not have (it comes with Developer Mode or admin),
# and antivirus "controlled folder access" blocks it too. When resolving fails,
# `cleanup_dead_symlinks` raises `PermissionError: [WinError 5]` from
# `pytest_sessionfinish` - AFTER every test has passed. The suite is green and
# the process still exits non-zero, which is the worst of both worlds: nothing
# to fix in the code, and no way to trust the exit code.
#
# Pointing basetemp at a directory we own sidesteps the junction entirely, and
# puts scratch I/O on the same drive as the project.
#
# WARNING: pytest DELETES the contents of basetemp. It must stay a dedicated
# folder - never point it at anything real. It is gitignored (`.pytest_tmp*/`).
# `-m "not jvm"` keeps JVM-starting tests out of the default run: JPype's
# startJVM can hard-crash the *host process* (a Windows access violation, not
# a Python exception) depending on the installed Java/JPype pair, taking the
# whole suite's result with it. A crash in one optional integration must not
# cost the report for everything else. Run them deliberately, in their own
# process: `pytest -m jvm`.
addopts = "-q --strict-markers -m \"not jvm and not e2e\""
# Keep the last few runs' temp trees for inspection, then discard them.
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"
markers = [
    "slow: takes more than a second (model loading, large fixtures)",
    "windows: requires Windows (Outlook MAPI, named mutex)",
    "jvm: starts a JVM in-process via JPype/mpxj; excluded by default, run with `pytest -m jvm`",
    "gui: a pytest-qt scenario driving the real MainWindow with keystrokes - offscreen, in the default run (order 0m S1a: this subset must count as RUN, never skipped - the vacuous-skip lesson from the PySide6 draft)",
    "e2e: pywinauto against the packaged, launched app on a real desktop; excluded by default, run with `pytest -m e2e` before a release (order 0m S3a)",
    "qt: constructs a real Qt widget; needs a display (or offscreen platform plugin)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".git", "__pycache__", "logs", "archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument: intentional in a few places
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]        # asserts are the point of a test
"app/core/errors.py" = ["BLE001"]   # broad catch at a boundary is deliberate

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["venv/", "build/", "dist/", "archive/"]
